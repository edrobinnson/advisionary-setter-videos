/* Layout: fixed gold-mark sidebar with section progress; main column holds one player card and the section playlist */
:root{--bg:#050505;--side:#0a0a09;--panel:#0e0e0d;--panel2:#141412;--line:#1f1e1b;--line2:#2c2a25;--text:#f4f1ea;--muted:#a8a296;--dim:#6f6a60;
  --gold:#CDB079;--gold2:#e9d6a8;--goldd:#8d7442;--red:#e25a4f;--green:#8FCB7B;
  --font:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 520px at 70% -10%,rgba(205,176,121,.10),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(205,176,121,.05),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}

/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#0c0b09,#070706);border-right:1px solid var(--line);padding:26px 14px 22px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 22px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.brand img{width:86px;height:auto;filter:drop-shadow(0 6px 22px rgba(205,176,121,.35))}
.brand b{margin-top:12px;font-weight:400;font-size:17px;letter-spacing:.32em;padding-left:.32em;color:var(--text)}
.brand small{margin-top:4px;font-size:9.5px;letter-spacing:.34em;padding-left:.34em;color:var(--gold);text-transform:uppercase}
.brand i{display:block;width:120px;height:1px;margin-top:10px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:14px;text-align:left}
.mi:hover{background:rgba(255,255,255,.035);color:var(--text)}
.mi.on{background:rgba(205,176,121,.08);color:var(--text)}
.mi .ic{width:14px;text-align:center;color:var(--gold);font-size:12px}
.mi .ct{margin-left:auto;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.lab{margin:18px 0 6px 12px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}
.sx{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:12px;text-align:left;color:var(--muted);font-size:13.5px;line-height:1.3}
.sx:hover{background:rgba(255,255,255,.035);color:var(--text)}
.sx.on{background:linear-gradient(90deg,rgba(205,176,121,.13),rgba(205,176,121,.03));color:var(--text);box-shadow:inset 0 0 0 1px rgba(205,176,121,.22)}
.sx .no{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);font-variant-numeric:tabular-nums}
.sx .pr{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.sx.full .pr{color:var(--green)}
.scrim{display:none}
.sidefoot{margin-top:auto;padding:16px 12px 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

/* main */
.main{min-width:0;padding-block:28px 70px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:grid;gap:22px}
.topbar{display:none}
.card{border-radius:24px;padding:26px 26px 22px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)),var(--panel);border:1px solid var(--line2);box-shadow:0 30px 80px -40px rgba(0,0,0,.9)}
.eb{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.eb i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.eb.soon i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
h1{margin:8px 0 4px;font-weight:300;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.015em;line-height:1.12;text-wrap:balance}
.lede{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000;border:1px solid rgba(205,176,121,.35);box-shadow:0 0 0 4px rgba(205,176,121,.05),0 24px 60px -24px rgba(205,176,121,.35)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster,.soonp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;text-decoration:none;color:var(--text);padding:20px;
  background:radial-gradient(560px 300px at 50% 30%,rgba(205,176,121,.16),transparent 70%),linear-gradient(160deg,#151410,#060605)}
.poster .pl{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(205,176,121,.7);box-shadow:0 0 40px -8px var(--gold);transition:transform .2s}
.poster .pl:after{content:'';margin-left:6px;border-left:22px solid var(--gold);border-top:14px solid transparent;border-bottom:14px solid transparent}
.poster:hover .pl{transform:scale(1.06)}
.poster span,.soonp span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.soonp img{width:64px;opacity:.85}
.soonp b{font-weight:300;font-size:22px}
.soonp p{margin:0;max-width:44ch;color:var(--muted);font-size:14px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:13.5px;text-decoration:none}
.btn:hover{border-color:rgba(205,176,121,.5)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;border-color:transparent;font-weight:500}
.btn.done{background:rgba(143,203,123,.12);border-color:rgba(143,203,123,.5);color:var(--green)}
.btn[disabled]{opacity:.35;pointer-events:none}
.ctrl .sp{flex:1}
.pos{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}

.list h2,.ov h2{margin:0 0 12px;font-weight:400;font-size:20px}
.lh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lh small{font-size:12px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;text-align:left;border:1px solid transparent}
.row+.row{margin-top:4px}
.row:hover{background:rgba(255,255,255,.03);border-color:var(--line)}
.row.on{background:rgba(205,176,121,.07);border-color:rgba(205,176,121,.28)}
.row .rn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;color:var(--muted);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.row.isdone .rn{color:#0c140a;background:var(--green);border-color:var(--green)}
.row .rt{font-size:15px;min-width:0}
.row .rt small{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.08em}
.row .st{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.row .st.w{color:var(--gold)}.row .st.d{color:var(--green)}

/* overview */
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.hero img{width:110px;filter:drop-shadow(0 10px 30px rgba(205,176,121,.35))}
.prog{margin-top:16px;display:grid;gap:8px}
.prog .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--goldd),var(--gold2));border-radius:6px;transition:width .4s}
.prog small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;text-align:left;border:1px solid var(--line2);background:radial-gradient(240px 120px at 0% 0%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%),var(--panel2);min-height:136px}
.tile:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.tile small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.tile b{font-weight:400;font-size:18px;line-height:1.25}
.tile .tp{margin-top:auto;display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tile .tb{height:3px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.tile .tb i{display:block;height:100%;background:var(--c)}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-102%);transition:transform .25s;padding-top:calc(26px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  body.nav .side{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.7)}
  .scrim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.55);display:none}
  body.nav .scrim{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:-28px 0 0;padding:12px 0;background:linear-gradient(var(--bg) 75%,transparent)}
  .topbar img{width:30px}.topbar b{font-weight:400;letter-spacing:.24em;font-size:13px}
  .topbar .btn{margin-left:auto;height:34px}
  body:after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .card{padding:18px 16px 16px;border-radius:20px}
  .hero{grid-template-columns:1fr;gap:14px}.hero img{width:72px}
  .ctrl .sp{display:none}
}
</style>

</head>

    <button class="mi" data-go="overview"><span class="ic">&#9670;</span>Overview</button>
    <button class="mi" data-go="all"><span class="ic">&#10003;</span>All videos<span class="ct" id="cAll"></span></button>
    <button class="mi" data-go="completed"><span class="ic">&#10003;</span>Completed<span class="ct" id="cDone">0</span></button>

<script>
var DATA = [{"name": "Welcome", "c": "#CDB079", "v": [{"s": "welcome", "t": "Welcome", "l": "14d880c98071418baa2305cd0c157a66"}]}, {"name": "Culture and Standards", "c": "#E89A6E", "v": [{"s": "code-of-honour", "t": "Code of Honour", "l": "6c0096e46e2e49ed8fce2b8278d1b6eb"}, {"s": "frequency-builder", "t": "Frequency Builder", "l": "45bb0daff95040b8b7b906cb241f293d"}]}, {"name": "The Fundamentals", "c": "#7DB6F5", "v": [{"s": "info-offers", "t": "Understanding Info Offers", "l": "e3aa45c2647347a786f39cec7dfa6f6c"}, {"s": "phone-setting", "t": "What Is Phone Setting?", "l": "776216dd88674947b02f3b9ee46e3692"}]}, {"name": "The Call", "c": "#B8A4F2", "v": [{"s": "universal-framework", "t": "The Universal Dialling Framework", "l": "7c5a05c1df464414a669f442aa8eac8c"}, {"s": "real-frameworks", "t": "Real Dialling Frameworks", "l": "ed24882cf00546ce8b2ec29581e8211e"}, {"s": "tonality", "t": "Tonality, ARA and Control", "l": "a440414bf4014aa68fb03c74a0c7410d"}, {"s": "pitch", "t": "How to Pitch a Strategy Call", "l": "e9c3a10d9bfa4d6e93739b0614c55639"}]}, {"name": "Converting", "c": "#8FCB7B", "v": [{"s": "objections", "t": "Objection Handling Framework", "l": "80017fcbf75548ae83919c8e0c536dfd"}, {"s": "closer-transfers", "t": "Live Closer Transfers", "l": "ac485884aa3c41bc9ce7822aa5ad7910"}, {"s": "book-confirm", "t": "How to Book and Confirm Calls", "l": "bfbefee5a90f4cbcb60c8861f0c1f6ab"}]}, {"name": "Systems and Operations", "c": "#7DB6F5", "v": [{"s": "speed-to-lead", "t": "Speed to Lead", "l": "a73dd0f2ecdf4bc69f437392ce19efa0"}, {"s": "dialling-cadence", "t": "The Dialling Cadence", "l": null}, {"s": "direct-booking", "t": "Direct Booking Contact", "l": "a206c8b422b44d5ba9b8a7be34780319"}, {"s": "close", "t": "How to Navigate Close", "l": "a9ef9077d6ac430a98b25131cbeb32fe"}, {"s": "ghl", "t": "How to Navigate GoHighLevel", "l": "29eff163718f4d88ac2e5471d99d4b2b"}, {"s": "discord", "t": "How to Navigate Discord", "l": "742c7c683f6f4cf486431b039ba3d133"}]}, {"name": "Your Career", "c": "#CDB079", "v": [{"s": "setter-to-closer", "t": "Setter to Closer Roadmap", "l": null}]}, {"name": "The Finish Line", "c": "#EF7A7A", "v": [{"s": "finish-line", "t": "The Finish Line", "l": "0a89db46bf1f4f28963761670e6e4756"}]}];
var LOGO = document.querySelector('.brand img').src;
var KEY = 'adv-setter-academy-done';
var done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }
var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }

var FLAT = [];
DATA.forEach(function(s, si){ s.v.forEach(function(v){ v.si = si; v.i = FLAT.length; FLAT.push(v); }); });
var BY = {}; FLAT.forEach(function(v){ BY[v.s] = v; });
function pad(n){ return (n < 10 ? '0' : '') + n; }
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function cnt(s){ var d = 0; s.v.forEach(function(v){ if (done[v.s]) d++; }); return d; }
function doneTotal(){ return FLAT.filter(function(v){ return done[v.s]; }).length; }

function renderSide(cur){
  var h = '';
  DATA.forEach(function(s, si){
    var d = cnt(s), on = cur && cur.si === si;
    h += '<button class="sx' + (on ? ' on' : '') + (d === s.v.length ? ' full' : '') + '" data-go="' + s.v[0].s + '" style="--c:' + s.c + '"><span class="no">' + pad(si) + '</span><span>' + esc(s.name) + '</span><span class="pr">' + d + '/' + s.v.length + '</span></button>';
  });
  document.getElementById('secs').innerHTML = h;
  document.getElementById('cAll').textContent = FLAT.length;
  document.getElementById('cDone').textContent = doneTotal();
  document.querySelectorAll('.mi').forEach(function(m){ m.classList.toggle('on', !cur && m.dataset.go === (location.hash.slice(1) || 'overview')); });
}

function topbar(){ return '<div class="topbar"><img src="' + LOGO + '" alt=""><b>ADVISIONARY</b><button class="btn" id="menu" aria-label="Open sections">Sections</button></div>'; }

function row(v, cur){
  var st = !v.l ? '<span class="st">Coming soon</span>' : done[v.s] ? '<span class="st d">Watched</span>' : '<span class="st w">Watch</span>';
  return '<button class="row' + (cur && cur.s === v.s ? ' on' : '') + (done[v.s] ? ' isdone' : '') + '" data-go="' + v.s + '"><span class="rn">' + (done[v.s] ? '&#10003;' : pad(v.i + 1)) + '</span><span class="rt">' + esc(v.t) + '<small>' + esc(DATA[v.si].name) + '</small></span>' + st + '</button>';
}

function player(v){
  if (!v.l) return '<div class="soonp"><img src="' + LOGO + '" alt=""><span>Recording soon</span><b>' + esc(v.t) + '</b><p>This video is being filmed. Keep working through the other videos in the meantime.</p></div>';
  if (framed) return '<a class="poster" href="https://www.loom.com/share/' + v.l + '" target="_blank" rel="noopener"><span class="pl" aria-hidden="true"></span><span>Watch on Loom</span></a>';
  return '<iframe src="https://www.loom.com/embed/' + v.l + '?hide_owner=true&hide_share=true&hideEmbedTopBar=true" title="' + esc(v.t) + '" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>';
}

function showVideo(v){
  var s = DATA[v.si], prev = FLAT[v.i - 1], next = FLAT[v.i + 1];
  var h = topbar() + '<section class="card"><div class="eb' + (v.l ? '' : ' soon') + '"><i></i>' + (v.l ? 'Training' : 'Coming soon') + ' &middot; ' + esc(s.name) + '</div><h1>' + esc(v.t) + '</h1>' +
    '<p class="lede">' + (!v.l ? 'Being filmed now. Work through the rest of the section in the meantime.' : v.i === 0 ? 'Watch this first, then work through the sections in order.' : 'Watch it through, then work through the rest of the section below.') + '</p>' +
    '<div class="player">' + player(v) + '</div><div class="ctrl">' +
    (v.l ? '<button class="btn' + (done[v.s] ? ' done' : ' gold') + '" id="mark">' + (done[v.s] ? '&#10003; Completed' : 'Mark as complete') + '</button>' : '') +
    (v.l && !framed ? '<a class="btn" href="https://www.loom.com/share/' + v.l + '" target="_blank" rel="noopener">Open in Loom &#8599;</a>' : '') +
    '<span class="sp"></span><span class="pos">' + (v.i + 1) + ' of ' + FLAT.length + '</span>' +
    '<button class="btn" data-go="' + (prev ? prev.s : '') + '"' + (prev ? '' : ' disabled') + '>&larr; Previous</button>' +
    '<button class="btn" data-go="' + (next ? next.s : '') + '"' + (next ? '' : ' disabled') + '>Next &rarr;</button></div></section>' +
    '<section class="card list"><div class="lh"><h2>' + esc(s.name) + '</h2><small>' + cnt(s) + ' of ' + s.v.length + ' watched</small></div>' + s.v.map(function(x){ return row(x, v); }).join('') + '</section>';
  view(h, v);
  var m = document.getElementById('mark');
  if (m) m.onclick = function(){ if (done[v.s]) delete done[v.s]; else done[v.s] = 1; save(); showVideo(v); };
}

function showOverview(){
  var d = doneTotal(), next = FLAT.filter(function(v){ return v.l && !done[v.s]; })[0] || FLAT[0];
  var h = topbar() + '<section class="card ov"><div class="hero"><img src="' + LOGO + '" alt=""><div><div class="eb soon"><i></i>Advisionary</div><h1>Advisionary Dialling</h1><p class="lede" style="margin:0">Every training video, in the order you should watch them. Start with the Welcome and work down. Your ticks are saved in your own browser, so they only show for you.</p>' +
    '<div class="prog"><div class="bar"><i style="width:' + Math.round(d / READY * 100) + '%"></i></div><small>' + d + ' of ' + READY + ' videos watched</small></div>' +
    '<div class="ctrl"><button class="btn gold" data-go="' + next.s + '">' + (d ? 'Continue: ' + esc(next.t) : 'Start with the Welcome') + ' &rarr;</button></div></div></div></section>' +
    '<section class="card ov"><h2>Sections</h2><div class="grid">' + DATA.map(function(s, si){
      var c = cnt(s); return '<button class="tile" data-go="' + s.v[0].s + '" style="--c:' + s.c + '"><small>Section ' + pad(si) + '</small><b>' + esc(s.name) + '</b><span class="tb"><i style="width:' + Math.round(c / s.v.length * 100) + '%"></i></span><span class="tp"><span>' + s.v.length + ' video' + (s.v.length > 1 ? 's' : '') + '</span><span>' + c + '/' + s.v.length + '</span></span></button>'; }).join('') + '</div></section>';
  view(h, null);
}

function showList(which){
  var items = which === 'completed' ? FLAT.filter(function(v){ return done[v.s]; }) : FLAT;
  var h = topbar() + '<section class="card list"><div class="lh"><h2>' + (which === 'completed' ? 'Completed' : 'All videos') + '</h2><small>' + items.length + ' video' + (items.length === 1 ? '' : 's') + '</small></div>' +
    (items.length ? items.map(function(v){ return row(v, null); }).join('') : '<p class="empty">Nothing marked complete yet. Watch a video and hit &ldquo;Mark as complete&rdquo;.</p>') + '</section>';
  view(h, null);
}

function view(h, cur){
  document.getElementById('view').innerHTML = h;
  renderSide(cur);
  document.body.classList.remove('nav');
  var mb = document.getElementById('menu'); if (mb) mb.onclick = function(){ document.body.classList.add('nav'); };
}

function route(){
  var k = location.hash.slice(1);
  if (BY[k]) showVideo(BY[k]);
  else if (k === 'all' || k === 'completed') showList(k);
  else showOverview();
  window.scrollTo(0, 0);
}
var READY = FLAT.filter(function(v){ return v.l; }).length;
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-go]');
  if (t && t.dataset.go) { if (location.hash.slice(1) === t.dataset.go) route(); else location.hash = t.dataset.go; }
});
document.getElementById('scrim').onclick = function(){ document.body.classList.remove('nav'); };
window.addEventListener('hashchange', route);
route();
</script>
